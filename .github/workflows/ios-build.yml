name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "fonts/**"
      - "videos/**"
      - "capacitor.config.json"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npm run sync-web && npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and screenshot
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" uz.kiberogoh.app
          sleep 4
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/simulator-screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/App.app

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: artifacts/simulator-screenshot.png
